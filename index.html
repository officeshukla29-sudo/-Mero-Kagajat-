<!DOCTYPE html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4f46e5"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><title>मेरो कागजात</title>
<style>

.mb textarea{flex:1;min-height:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:inherit;font-size:15px;resize:none}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:13px;padding:8px 10px;min-height:0}

.zoom.big{display:block}.zoom.big img{max-width:none;max-height:none;width:250%}
.zoom .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.25);color:#fff;border:0}

<script>
const $=s=>document.querySelector(s);
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const SS=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
if(LS('th'))document.documentElement.dataset.theme=LS('th');
const GR=[['#667eea','#764ba2'],['#f093fb','#f5576c'],['#4facfe','#00b4d8'],['#43e97b','#12a58a'],['#fa709a','#f59e0b'],['#a18cd1','#e879a9']];
const esc=s=>(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let M={cats:[{id:'bill',n:'बिल बुक',e:'📘',b:1},{id:'lic',n:'लाइसेन्स',e:'🪪'},{id:'cit',n:'नागरिकता',e:'📄'},{id:'vot',n:'मतदाता परिचयपत्र',e:'🗳️'},{id:'nid',n:'राष्ट्रिय परिचयपत्र',e:'🆔'}],info:{}};
/* storage */
const mem={};let dbp;
try{dbp=new Promise((res,rej)=>{const r=indexedDB.open('docvault',1);r.onupgradeneeded=()=>r.result.createObjectStore('d');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){dbp=Promise.reject(e)}
dbp.catch(()=>{});
async function get(k,d=[]){try{const db=await dbp;return await new Promise((res,rej)=>{const q=db.transaction('d').objectStore('d').get(k);q.onsuccess=()=>res(q.result===undefined?d:q.result);q.onerror=()=>rej(q.error)})}catch(e){return mem[k]||d}}
async function put(k,v){mem[k]=v;try{const db=await dbp;await new Promise((res,rej)=>{const t=db.transaction('d','readwrite');t.objectStore('d').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* image pipeline */
function detect(c){
  const s=400/Math.max(c.width,c.height),W=Math.max(1,Math.round(c.width*s)),H=Math.max(1,Math.round(c.height*s));
  const k=document.createElement('canvas');k.width=W;k.height=H;const x=k.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data,m=Math.max(2,Math.round(Math.min(W,H)*.03)),R=[],G=[],B=[];
  for(let y=0;y<H;y++)for(let i=0;i<W;i++)if(y<m||y>=H-m||i<m||i>=W-m){const p=(y*W+i)*4;R.push(d[p]);G.push(d[p+1]);B.push(d[p+2])}
  const med=a=>a.sort((p,q)=>p-q)[a.length>>1],r=med(R),g=med(G),b=med(B),rows=new Uint16Array(H),cols=new Uint16Array(W);
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const p=(y*W+i)*4,a=d[p]-r,e=d[p+1]-g,f=d[p+2]-b;if(a*a+e*e+f*f>4900){rows[y]++;cols[i]++}}
  const f=(a,n)=>{let lo=-1,hi=-1;for(let i=0;i<a.length;i++)if(a[i]>n*.12){if(lo<0)lo=i;hi=i}return[lo,hi]};
  const[y0,y1]=f(rows,W),[x0,x1]=f(cols,H);if(y0<0||x0<0)return null;
  const ar=(x1-x0)*(y1-y0)/(W*H);if(ar<.15||ar>.97)return null;
  const X0=Math.max(0,x0-W*.01),Y0=Math.max(0,y0-H*.01),X1=Math.min(W,x1+W*.01),Y1=Math.min(H,y1+H*.01);
  return{x:X0/W,y:Y0/H,w:(X1-X0)/W,h:(Y1-Y0)/H}}
function enhance(c,mode){if(mode==='o')return;
  const x=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,im=x.getImageData(0,0,w,h),d=im.data,hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4)hist[(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0]++;
  const n=w*h;let a=0,lo=0,hi=255;for(let i=0;i<256;i++){a+=hist[i];if(a>=n*.01){lo=i;break}}a=0;for(let i=255;i>=0;i--){a+=hist[i];if(a>=n*.005){hi=i;break}}
  if(hi-lo<40){lo=0;hi=255}const k=255/(hi-lo),lut=new Uint8ClampedArray(256);for(let i=0;i<256;i++)lut[i]=((i-lo)*k-128)*1.06+128;
  for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}
  if(mode==='b'){const l2=new Uint8ClampedArray(256);for(let i=0;i<256;i++)l2[i]=(i-70)*255/130;for(let i=0;i<d.length;i+=4){const g=l2[(d[i]*.299+d[i+1]*.587+d[i+2]*.114)|0];d[i]=d[i+1]=d[i+2]=g}}
  const o=new Uint8ClampedArray(d);
  for(let y=1;y<h-1;y++)for(let i=1;i<w-1;i++){const p=(y*w+i)*4;for(let j=0;j<3;j++){const q=p+j;d[q]=3*o[q]-.5*(o[q-4]+o[q+4]+o[q-w*4]+o[q+w*4])}}
  x.putImageData(im,0,0)}
const dims=(b,n)=>n%2?[b.height,b.width]:[b.width,b.height];
function paint(x,b,n,cx,cy,k){const[RW,RH]=dims(b,n);x.scale(k,k);x.translate(-cx,-cy);
  if(n===1){x.translate(RW,0);x.rotate(Math.PI/2)}else if(n===2){x.translate(RW,RH);x.rotate(Math.PI)}else if(n===3){x.translate(0,RH);x.rotate(-Math.PI/2)}
  x.drawImage(b,0,0)}
function finalize(b,n,r,mode){const[RW,RH]=dims(b,n),cw=r.w*RW,ch=r.h*RH,L=Math.max(cw,ch),k=L>2400?2400/L:1,c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(cw*k));c.height=Math.max(1,Math.round(ch*k));const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  paint(x,b,n,r.x*RW,r.y*RH,k);enhance(c,mode);return new Promise(z=>c.toBlob(z,'image/jpeg',.9))}
const TC=new WeakMap();
async function thumb(b){if(TC.has(b))return TC.get(b);const bm=await createImageBitmap(b,{resizeWidth:120,resizeQuality:'low'}),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);bm.close();
  const u=URL.createObjectURL(await new Promise(z=>c.toBlob(z,'image/jpeg',.6)));TC.set(b,u);return u}
function review(f){return new Promise(async res=>{
  const FL=['contrast(1.12) saturate(1.1)','grayscale(1) contrast(1.5) brightness(1.1)','none'],MD=['रङ्गीन','B&W','मूल'],MC=['c','b','o'],m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class=mb><div class=pv><span>खुल्दैछ…</span></div><div class="row s"><button data-k=r>⟳ घुमाउ</button><button data-k=a>🪄 Auto</button><button data-k=p>⛶ पुरै</button><button data-k=f>🎨 रङ्गीन</button></div><div class=row><button data-k=x>रद्द</button><button class=pri data-k=s>✔ सेभ</button></div></div>';
  document.body.appendChild(m);const pv=m.querySelector('.pv'),q=k=>m.querySelector('[data-k='+k+']');let bmp;
  try{bmp=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){pv.textContent='फोटो खोल्न सकिएन';q('s').disabled=true;q('x').onclick=()=>{m.remove();res(null)};return}
  let rot=0,mi=0,r={x:0,y:0,w:1,h:1},pc,box,dw=1,dh=1,drag=null;
  const place=()=>{box.style.cssText=`left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%`};
  function build(){const[RW,RH]=dims(bmp,rot),ps=Math.min(1100/Math.max(RW,RH),1);pc=document.createElement('canvas');pc.width=Math.round(RW*ps);pc.height=Math.round(RH*ps);
    paint(pc.getContext('2d'),bmp,rot,0,0,ps);pc.style.filter=FL[mi];
    const s=Math.min((pv.clientWidth-32)/pc.width,(pv.clientHeight-32)/pc.height);dw=pc.width*s;dh=pc.height*s;pc.style.cssText+=`;width:${dw}px;height:${dh}px;display:block`;
    const w=document.createElement('div');w.className='cw';w.style.cssText=`width:${dw}px;height:${dh}px`;w.appendChild(pc);
    box=document.createElement('div');box.className='cb';
    box.innerHTML=[['nw',0,0],['n',50,0],['ne',100,0],['e',100,50],['se',100,100],['s',50,100],['sw',0,100],['w',0,50]].map(h=>`<i class=hd data-h=${h[0]} style="left:${h[1]}%;top:${h[2]}%"></i>`).join('');
    w.appendChild(box);pv.innerHTML='';pv.appendChild(w);place();
    w.onpointerdown=e=>{const h=e.target.dataset.h||(e.target===box?'m':null);if(!h)return;drag={h,sx:e.clientX,sy:e.clientY,o:{...r}};w.setPointerCapture(e.pointerId);e.preventDefault()};
    w.onpointermove=e=>{if(!drag)return;const dx=(e.clientX-drag.sx)/dw,dy=(e.clientY-drag.sy)/dh,o=drag.o,h=drag.h,N=.06;let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;
      if(h==='m'){x0=Math.min(1-o.w,Math.max(0,o.x+dx));y0=Math.min(1-o.h,Math.max(0,o.y+dy));x1=x0+o.w;y1=y0+o.h}
      else{if(h.includes('w'))x0=Math.min(x1-N,Math.max(0,x0+dx));if(h.includes('e'))x1=Math.max(x0+N,Math.min(1,x1+dx));if(h.includes('n'))y0=Math.min(y1-N,Math.max(0,y0+dy));if(h.includes('s'))y1=Math.max(y0+N,Math.min(1,y1+dy))}
      r={x:x0,y:y0,w:x1-x0,h:y1-y0};place()};
    w.onpointerup=w.onpointercancel=()=>drag=null}
  build();r=detect(pc)||r;place();
  q('r').onclick=()=>{rot=(rot+1)%4;r={x:1-(r.y+r.h),y:r.x,w:r.h,h:r.w};build()};
  q('a').onclick=()=>{r=detect(pc)||{x:0,y:0,w:1,h:1};place()};
  q('p').onclick=()=>{r={x:0,y:0,w:1,h:1};place()};
  q('f').onclick=()=>{mi=(mi+1)%3;q('f').textContent='🎨 '+MD[mi];pc.style.filter=FL[mi]};
  q('x').onclick=()=>{bmp.close();m.remove();res(null)};
  q('s').onclick=async()=>{q('s').disabled=true;q('s').textContent='सेभ हुँदैछ…';await new Promise(z=>setTimeout(z,50));const b=await finalize(bmp,rot,r,MC[mi]);bmp.close();m.remove();res(b)}})}
/* app state */
let view='home',pages=[],idx=0,flip=false,urls=[];
const cat=()=>M.cats.find(c=>c.id===view),cur=()=>cat().b?idx:(flip?1:0);
const url=b=>{if(!b)return'';const u=URL.createObjectURL(b);urls.push(u);return u};
const clean=()=>{urls.forEach(u=>URL.revokeObjectURL(u));urls=[]};
function exp(id){const e=(M.info[id]||{}).exp;if(!e)return null;const d=Math.ceil((new Date(e)-Date.now())/864e5);return{d,t:d<0?'म्याद सकियो':d+' दिन बाँकी',c:d<0?'r':d<=30?'y':'g'}}
async function home(){view='home';clean();const ps=await Promise.all(M.cats.map(c=>get(c.id)));let tot=0,soon=0;const al=[];
  const tiles=M.cats.map((c,i)=>{const n=c.b?ps[i].length:ps[i].filter(Boolean).length,x=exp(c.id),g=GR[i%GR.length];tot+=n;if(x&&x.d<=30){soon++;al.push(c.e+' '+c.n+': '+x.t)}
    return `<button class=tile style="--a:${g[0]};--b:${g[1]};--i:${i}" data-a=open data-id=${c.id}><span class=em>${c.e}</span><b>${c.n}</b><small>${c.b?n+' पाना':n+'/2 फोटो'}</small>${x?`<i class="bd ${x.c}">${x.t}</i>`:''}</button>`}).join('');
